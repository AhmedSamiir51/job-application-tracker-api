services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=jobtracker;Username=postgres;Password=postgres
      # Override with your own secret: JWT_SIGNING_KEY=$(openssl rand -base64 48) docker compose up
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-docker-only-signing-key-change-me-please}
      Database__MigrateOnStartup: "true"
    restart: unless-stopped

volumes:
  pgdata:
